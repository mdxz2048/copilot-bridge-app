name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test vendored Proxy
        run: npm run test:proxy

      - name: Package NSIS installer
        run: npm run package:installer

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: copilot-bridge-windows
          path: "release/Copilot Bridge Setup *.exe"
          if-no-files-found: error
